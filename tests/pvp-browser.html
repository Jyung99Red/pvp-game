<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>PVP 双端浏览器验证</title><style>
body{margin:12px;background:#101b20;color:#eee;font:14px system-ui}button{padding:8px;margin:4px}#clients{display:flex;gap:12px;align-items:start}iframe{border:1px solid #61757c;width:390px;height:780px;flex:none}pre{white-space:pre-wrap;max-height:110px;overflow:auto;font-size:11px}body.landscape iframe{width:740px;height:390px}#status{min-height:34px}</style></head><body>
<button id="local">启动双端（60ms 单程模拟延迟）</button><button id="real">启动真实 WebRTC</button><button id="attack">客机轻击检验</button><button id="rematch">投降并重赛检验</button><button id="rotate">横屏 / 竖屏</button>
<button id="heavy">合并重击检验</button><button id="guard-demo">举盾 / 收盾演示</button>
<div id="status">等待测试客户端加载（不读取养成存档）</div><pre id="report"></pre><div id="clients"><iframe title="主机" src="pvp-browser-client.html"></iframe><iframe title="客机" src="pvp-browser-client.html"></iframe></div><script>
const frames=[...document.querySelectorAll('iframe')],status=document.getElementById('status'),report=document.getElementById('report');
const clients=()=>frames.map(f=>f.contentWindow.qa),wait=ms=>new Promise(r=>setTimeout(r,ms));
let errors=[],mode='';window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data.qaError){errors.push(e.data.qaError);status.textContent='ERROR: '+errors.join(' | ');}else if(clients().every(Boolean))status.textContent='两个客户端加载完成';});
document.getElementById('local').onclick=()=>{if(mode)return;mode='local';const[h,g]=clients();h.local('host',m=>{setTimeout(()=>g.receive(structuredClone(m)),60);return true;});g.local('guest',m=>{setTimeout(()=>h.receive(structuredClone(m)),60);return true;});h.start(g.profile());status.textContent='双端已启动，模拟单程60ms延迟';};
document.getElementById('real').onclick=async()=>{if(mode)return;mode='real';const[h,g]=clients();status.textContent='正在创建真实WebRTC房间';await h.host();const code=h.code();if(!/^\d{6}$/.test(code)){status.textContent='创建房间未成功，请查看主机提示';return;}await g.join(code);status.textContent='已通过房间码连接真实WebRTC';};
document.getElementById('attack').onclick=async()=>{const[h,g]=clients();h.closeActors();await wait(300);const before=h.report().hp[0];g.input({type:'press',channel:'move',values:[0,0]});g.input({type:'release',channel:'move',cancelled:false});await wait(500);const a=h.report(),b=g.report();status.textContent=a.hp[0]<before&&JSON.stringify(a.hp)===JSON.stringify(b.hp)?'PASS: 客机轻击命中，双方HP一致':'FAIL: '+JSON.stringify({before,a,b});};
document.getElementById('rematch').onclick=async()=>{const[h,g]=clients(),old=h.report().id;g.surrender();await wait(400);const ended=h.report().result==='host'&&g.report().result==='host';g.rematch();h.rematch();await wait(2100);status.textContent=ended&&h.report().id!==old&&h.report().id===g.report().id&&h.report().active?'PASS: 投降结算及重赛重置一致':'FAIL: 重赛';};
document.getElementById('rotate').onclick=()=>document.body.classList.toggle('landscape');
document.getElementById('heavy').onclick=async()=>{
 const[h,g]=clients();h.closeActors();await wait(350);
 const before=h.report();g.input({type:'press',channel:'move',values:[0,0]});await wait(650);
 const charging=h.report().phase[1]==='charging';
 g.input({type:'drag',channel:'move',values:[0,60,0,60]});await wait(150);
 const moved=h.report().y[1]>before.y[1];
 // Reverse and release in the same input batch: there is no simulation time to turn.
 g.input({type:'drag',channel:'move',values:[0,-60,0,-60]});
 g.input({type:'release',channel:'move',cancelled:false});await wait(750);
 const a=h.report(),b=g.report();
 status.textContent=charging&&moved&&Math.abs(a.attackFacing[1]-Math.PI/2)<.1&&a.hp[0]<before.hp[0]&&JSON.stringify(a.hp)===JSON.stringify(b.hp)?
  'PASS: 客机长按蓄力、60%走位、反向松手保留人物朝向，重击HP同步':'FAIL: '+JSON.stringify({charging,moved,before,a,b});
};
let guarding=false;document.getElementById('guard-demo').onclick=()=>{guarding=!guarding;for(const c of clients())c.input({type:guarding?'press':'release',channel:'guard',values:[0,0],cancelled:false});status.textContent=guarding?'双方举盾中：盾牌应在人物正前方':'双方收盾：盾牌应回到侧边';};
setInterval(()=>{const c=clients();if(c.every(Boolean))report.textContent=JSON.stringify(c.map(x=>x.report()),null,2);},250);
</script></body></html>
