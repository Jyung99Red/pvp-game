<div id="view-pvp-battle" class="view-section hidden training spatial-fullscreen">
    <section class="arena" aria-label="俯视战场">
        <canvas id="pvp-s-arena" aria-label="蓝色为你，红色为对手；双方在同一空间移动和攻防"></canvas>
    <header class="topbar">
        <button type="button" onclick="pvpLogic.surrender()">投降</button>
        <div><strong id="pvp-floor-label">空间对战</strong><span id="pvp-enemy-name">敌人</span></div>
        <button id="pvp-s-pause" type="button" onclick="uiPvp.showSettings(true)">设置</button>
    </header>
    <section class="vitals" aria-label="双方状态">
        <div class="vital"><div><span>你 · 剑盾</span><b id="pvp-s-player-hp">120 / 120</b></div><meter id="pvp-s-player-meter" min="0" max="120" value="120">120</meter></div>
        <div class="vital enemy"><div><span id="pvp-enemy-vital">敌人</span><b id="pvp-s-enemy-hp">360 / 360</b></div><meter id="pvp-s-enemy-meter" min="0" max="360" value="360">360</meter></div>
    </section>

        <div class="legend"><i></i>起手 <i></i>锁定 <i></i>反击空档</div>
        <div id="pvp-s-overlay" class="overlay" hidden>
            <div class="overlay-card"><h1>操作设置</h1><p>对局仍在继续，关闭设置后继续操作。</p>
            <fieldset class="combat-settings"><legend>玩家操作</legend>
                <label><input type="checkbox" data-combat-setting="cancelAtCenter" checked> 中心松手取消（重击 / 技能）</label>
                <small>关闭后重击直接释放；技能沿用本次最后选中方向，未拖出死区不释放。</small>
                <label><input type="checkbox" data-combat-setting="autoFace"> 自动朝向对手</label>
                <small>默认跟随移动方向；停止移动保留朝向，重击 / 防御由右手转向。</small>
            </fieldset>
            <button type="button" onclick="uiPvp.showSettings(false)">关闭设置</button></div>
        </div>
    <section class="feedback" aria-label="操作反馈">
        <div class="ap-row"><span>行动力</span><div id="pvp-s-ap" aria-label="行动力 5 / 5"></div><span id="pvp-s-player-state">准备就绪</span></div>
        <div class="charge-track"><div id="pvp-s-charge-fill"></div></div>
        <div id="pvp-s-notice" role="status">左手移动 / 轻击，右手重击 / 防御转向。</div>
        <div class="skill-status">技能 <span id="pvp-self-sp">0 / 3</span></div>
        <div id="pvp-s-battle-log" class="battle-log" aria-label="最近战斗记录"></div>
        <div class="arena-top"><span id="pvp-s-enemy-state">等待双方准备</span><span id="pvp-s-clock">0:00</span></div>
        <div id="pvp-log" aria-label="场地记录"></div>
    </section>
    <section class="controls" aria-label="双指操作：左手移动，右手重击或防御">
        <div class="control-group move-group" aria-label="在左侧区域按下移动，轻点轻击">
            <button id="pvp-s-move-pad" class="pad move-pad" data-dynamic hidden type="button" aria-label="移动和轻击：拖动移动，轻点轻击，可与右侧重击或防御同时操作">
                <span class="pad-icon">✥</span><strong id="pvp-s-move-label">移动 / 轻击</strong><span class="pad-knob"></span>
            </button>
        </div>
        <div class="right-controls" aria-label="右手操作，四宫格预留">
        <div class="control-group action-group">
            <button id="pvp-s-action-pad" class="pad action-pad" type="button" aria-label="重击：按住蓄力，拖动只转向，中心外松手攻击，红色中心松手取消">
                <span class="pad-icon">×</span><strong id="pvp-s-action-label">重击 / 转向</strong><span class="cancel-zone" aria-hidden="true"></span><span class="pad-knob"></span>
            </button>
        </div>
        <div class="control-group guard-group">
            <button id="pvp-s-guard-pad" class="pad guard-pad" type="button" aria-label="防御：按住举盾，拖动只转向，左手可同时移动，松手撤防">
                <span class="pad-icon">○</span><strong id="pvp-s-guard-label">防御 / 转向</strong><span class="pad-knob"></span>
            </button>
        </div>
    <section class="skill-dock" aria-label="四向技能">

        <button id="pvp-s-skill-pad" class="pad skill-pad" type="button" aria-label="拖动选择技能，松手释放：上治疗、右疾速、下满蓄、左弹反">
            <strong id="pvp-s-skill-label">技能</strong><span class="pad-knob"></span>
            <span data-skill="heal" class="skill-direction skill-up">治疗 · 2</span>
            <span data-skill="haste" class="skill-direction skill-right">疾速 · 2</span>
            <span data-skill="full" class="skill-direction skill-down">满蓄 · 2</span>
            <span data-skill="parry" class="skill-direction skill-left">弹反 · 3</span>
        </button>
    </section>
        </div>
    </section>

    <div id="pvp-buff-display" class="buff-status"></div>

    </section>
    <div id="pvp-result-overlay" class="result-overlay hidden">
        <h2 id="pvp-result-title"></h2>
        <button id="pvp-btn-rematch" onclick="pvpLogic.requestRematch()">再来一局</button>
        <p id="pvp-rematch-waiting" class="hidden">等待对手同意…</p>
        <div id="pvp-rematch-request" class="hidden"><p>对手想再来一局</p><button onclick="pvpLogic.acceptRematch()">同意重赛</button></div>
        <button onclick="pvpRoom.giveUpToLobby()">返回大厅</button>
    </div>
    <div id="pvp-disconnect-overlay" class="result-overlay hidden">
        <h2>本局已中止</h2><p>一方离开前台或连接中断。返回大厅后可以重新开局。</p>
        <button onclick="pvpRoom.giveUpToLobby()">返回大厅</button>
    </div>
</div>
