<!-- The region, and the only place the world is drawn. Walking and fighting share
     this canvas, camera and control pads -- a fight is the same view reading the
     fight's config instead of the walking preset, so contact has no cut to make.
     The `training` class is load-bearing: it is what carries the shared pad
     styling from combat_controls.css. The view must NOT carry
     `spatial-fullscreen` -- that class is what makes PVP a full-screen takeover. -->
<div id="view-adventure" class="view-section hidden adventure training">
    <!-- The map fills the view and everything else floats over it: the region
         name plate, the quick-access buttons and the hint line are all overlays,
         which is what leaves the picture the whole area instead of the strips a
         heading and a hint bar would take. -->
    <section class="adventure-map" aria-label="可探索的大地图">
        <canvas id="adventure-world" aria-label="拖动移动键行走，接触怪物后直接进入战斗"></canvas>

        <header class="topbar">
            <button type="button" class="adventure-flee fight-only" onclick="pveLogic.flee()">撤退</button>
            <div><strong id="adv-floor-label">区域地图</strong><span id="adv-enemy-name">探索中</span></div>
            <button id="adv-s-pause" type="button" onclick="pveLogic.pause()">暂停 / 设置</button>
        </header>

        <!-- Quick access while walking. In a fight they are either locked
             (equipment) or in the way, so walking is the only time they show. -->
        <div class="hud-buttons walk-only" role="group" aria-label="快捷面板">
            <button type="button" onclick="ui.filterInventory('all');ui.openInventoryModal()" aria-label="背包">🎒</button>
            <button type="button" onclick="ui.openCharacterModal()" aria-label="角色状态">👤</button>
            <button type="button" onclick="ui.filterInventory('equipment');ui.openInventoryModal()" aria-label="装备">🛡</button>
        </div>

        <!-- Region name plate, walking only: the topbar centre carries the enemy
             name during a fight, so the two never show at the same time. -->
        <div class="region-plate walk-only">
            <h1 id="adventure-region-name">—</h1>
            <p id="adventure-region-desc" class="adventure-desc"></p>
            <span id="adventure-region-kind" class="status-chip"><i></i> 探索中</span>
        </div>

        <!-- The walking hint, as a translucent log line over the map. -->
        <p id="adventure-hint" class="adventure-hint" role="status"></p>
        <section class="vitals fight-only" aria-label="双方状态">
            <div class="vital"><div><span>你 · 剑盾</span><b id="adv-s-player-hp">120 / 120</b></div><meter id="adv-s-player-meter" min="0" max="120" value="120">120</meter></div>
            <div class="vital enemy"><div><span id="adv-enemy-vital">敌人</span><b id="adv-s-enemy-hp">360 / 360</b></div><meter id="adv-s-enemy-meter" min="0" max="360" value="360">360</meter></div>
        </section>
        <div class="legend fight-only"><i></i>起手 <i></i>锁定 <i></i>反击空档</div>

        <div id="adv-s-overlay" class="overlay" hidden>
            <div class="overlay-card"><h1>已暂停</h1><p>触摸已释放，点击继续。</p>
            <fieldset class="combat-settings"><legend>玩家操作</legend>
                <label><input type="checkbox" data-combat-setting="cancelAtCenter" checked> 中心松手取消（重击 / 技能）</label>
                <small>关闭后重击直接释放；技能沿用本次最后选中方向，未拖出死区不释放。</small>
                <label><input type="checkbox" data-combat-setting="autoFace"> 自动朝向怪物</label>
                <small>仅待机时按转速自动转向敌人；移动跟随拖动方向，攻击按松手时人物朝向。</small>
            </fieldset>
            <button type="button" onclick="pveLogic.resume()">继续</button></div>
        </div>

        <section class="feedback" aria-label="操作反馈">
            <div class="ap-row"><span>行动力</span><div id="adv-s-ap" aria-label="行动力 5 / 5"></div><span id="adv-s-player-state">准备就绪</span></div>
            <div class="charge-track"><div id="adv-s-charge-fill"></div></div>
            <div id="adv-s-notice" role="status">拖动移动键行走 · 短按轻击 · 原位长按蓄力</div>
            <div class="skill-status">技能 <span id="adv-self-sp">0 / 3</span></div>
            <div id="adv-s-battle-log" class="battle-log" aria-label="最近战斗记录"></div>
            <div class="arena-top fight-only"><span id="adv-s-enemy-state">观察起手 → 走位或接招</span><span id="adv-s-clock">0:00</span></div>
            <div id="adv-s-log" aria-label="场地记录"></div>
        </section>

        <section class="controls combined-controls" aria-label="中央移动，左侧防御，右侧技能">
            <div class="control-group move-group" aria-label="中央操作区：拖动移动，短按轻击，原位长按蓄力">
                <button id="adv-s-move-pad" class="pad move-pad" data-origin-at-press type="button" aria-label="拖动移动键行走；走近建筑后点击中央键与之交互">
                    <span class="pad-icon">✥</span><strong id="adv-s-move-label">移动</strong><span class="cancel-zone" aria-hidden="true"></span><span class="pad-knob"></span>
                </button>
            </div>
            <div class="control-group guard-group">
                <button id="adv-s-guard-pad" class="pad guard-pad" type="button" aria-label="防御：按住举盾，拖动转向，可同时操作中央移动键，松手撤防">
                    <span class="pad-icon">○</span><strong id="adv-s-guard-label">防御 / 转向</strong><span class="pad-knob"></span>
                </button>
            </div>
            <section class="skill-dock" aria-label="四向技能">
                <button id="adv-s-skill-pad" class="pad skill-pad" type="button" aria-label="拖动选择技能，松手释放：上治疗、右疾速、下满蓄、左弹反">
                    <strong id="adv-s-skill-label">技能</strong><span class="pad-knob"></span>
                    <span data-skill="heal" class="skill-direction skill-up">治疗 · 2</span>
                    <span data-skill="haste" class="skill-direction skill-right">疾速 · 2</span>
                    <span data-skill="full" class="skill-direction skill-down">满蓄 · 2</span>
                    <span data-skill="parry" class="skill-direction skill-left">弹反 · 3</span>
                </button>
            </section>
        </section>

        <div id="adv-buff-display" class="buff-status"></div>

        <!-- No victory screen: a won fight banks its rewards and puts the walk
             straight back on screen, with the summary in the log line above. -->
        <div id="adv-defeat-overlay" class="result-overlay hidden">
            <h2>英雄倒下</h2><p>你被救回了曙光据点。</p><button onclick="pveLogic.endFight()">回到基地</button>
        </div>
    </section>
    <!-- Kept as the log sink: `ui.log` appends here and the toast mirrors it. -->
    <div id="log"></div>
</div>
