<main class="game" id="game">
    <canvas class="game-canvas" aria-label="游戏画面"></canvas>
    <div class="game-fallback" data-fallback role="alert" hidden></div>
    <div class="hud-perf" data-perf aria-live="off"></div>
    <div class="hud-mobs" data-hud="mobs" aria-hidden="true"></div>
    <div class="hud-floats" data-hud="floats" aria-hidden="true"></div>
    <div class="hud-banner" data-hud="banner" aria-live="polite" hidden></div>
    <div class="hud-region" data-hud="region" aria-live="polite" hidden><b data-hud="region-title"></b><span data-hud="region-note"></span></div>
    <div class="hud-tag" data-hud="tag" aria-hidden="true" hidden><b data-hud="tag-name"></b><span data-hud="tag-why"></span></div>
    <div class="hud-hold" data-hud="hold" aria-hidden="true" hidden></div>
    <div class="hud-toasts" data-hud="toasts" aria-live="polite"></div>
    <div class="hud-arrow" data-hud="arrow" aria-hidden="true" hidden></div>
    <div class="hud-top">
        <div class="hud-self">
            <div class="hud-clock" data-hud="clock" data-body="sun" role="img" aria-label="时刻">
                <svg viewBox="-50 -50 100 100" aria-hidden="true">
                    <path class="clock-rays" d="M0.0 -49.0 L10.5 -39.1 L24.5 -42.4 L28.6 -28.6 L42.4 -24.5 L39.1 -10.5 L49.0 -0.0 L39.1 10.5 L42.4 24.5 L28.6 28.6 L24.5 42.4 L10.5 39.1 L0.0 49.0 L-10.5 39.1 L-24.5 42.4 L-28.6 28.6 L-42.4 24.5 L-39.1 10.5 L-49.0 0.0 L-39.1 -10.5 L-42.4 -24.5 L-28.6 -28.6 L-24.5 -42.4 L-10.5 -39.1Z"/>
                    <circle class="clock-back" r="40"/>
                    <g class="clock-ring" data-hud="clock-ring"></g>
                    <circle class="clock-face" r="28.5"/>
                    <path class="clock-marks" d="M0 -24v5M0 24v-5M-24 0h5M24 0h-5"/>
                    <g data-hud="clock-hand"><path class="clock-hand" d="M-3 5 0 -35 3 5Z"/></g>
                    <circle class="clock-pin" r="3.6"/>
                    <g class="clock-badge" transform="translate(-34 34)">
                        <circle class="badge-back" r="14.5"/>
                        <g class="badge-sun"><circle r="5"/><path d="M0.0 -7.2L0.0 -10.2M5.1 -5.1L7.2 -7.2M7.2 -0.0L10.2 -0.0M5.1 5.1L7.2 7.2M0.0 7.2L0.0 10.2M-5.1 5.1L-7.2 7.2M-7.2 0.0L-10.2 0.0M-5.1 -5.1L-7.2 -7.2"/></g>
                        <path class="badge-moon" d="M2.5 -8.5A9 9 0 1 0 8.5 5 7.4 7.4 0 0 1 2.5 -8.5Z"/>
                    </g>
                </svg>
            </div>
            <div class="hud-bars" aria-label="生命与格挡条">
                <div class="bar bar-hp"><i data-hud="hp"></i></div>
                <div class="bar bar-guard" data-hud="guard-bar"><i data-hud="guard"></i></div>
                <div class="hud-goal" data-hud="goal" hidden></div>
            </div>
        </div>
        <div class="hud-combo" data-hud="combo" aria-live="off">
            <div class="chips" data-hud="chips"></div>
            <div class="move-name" data-hud="move"></div>
        </div>
        <div class="hud-target" data-hud="target" hidden>
            <span class="target-name"><em class="target-boss" data-hud="boss" hidden>首领</em><b data-hud="target-name">训练木桩</b><em class="target-rage" data-hud="rage" hidden>狂暴</em></span>
            <div class="bar bar-target"><i data-hud="target-hp"></i></div>
            <div class="pips" data-hud="pips" aria-label="失衡"><i></i><i></i><i></i></div>
        </div>
    </div>

    <div class="stick-zone" data-stick-zone></div>
    <div class="stick" data-stick aria-hidden="true"><div class="stick-knob" data-knob></div></div>

    <button type="button" class="ctl ctl-attack" data-button="attack" aria-label="攻击（点按 A，长按 B）">攻击</button>
    <button type="button" class="ctl ctl-offhand disabled" data-button="offhand" data-kind="none" aria-label="副手">
        <svg class="icon-torch" viewBox="0 0 24 24" aria-hidden="true"><path class="torch-stick" d="M10.5 10h3l-1 12h-1z"/><path class="torch-head" d="M9 7h6v4H9z"/><path class="torch-flame" d="M12 1c2 2.5 3.5 3.8 3.5 5.6 0 .3 0 .3-.1.4H8.6c-.1-.1-.1-.1-.1-.4C8.5 4.8 10 3.5 12 1z"/></svg>
        <svg class="icon-potion" viewBox="0 0 24 24" aria-hidden="true"><path class="potion-glass" d="M9.5 2h5v2h-1v4.2c3 1.2 5 3.8 5 7 0 4.2-2.9 6.8-6.5 6.8S5.5 19.4 5.5 15.2c0-3.2 2-5.8 5-7V4h-1z"/><path class="potion-liquid" d="M7 15h10c0 3-2 5.3-5 5.3S7 18 7 15z"/></svg>
        <span class="ctl-count" data-hud="offhand-count" hidden></span>
    </button>
    <button type="button" class="ctl ctl-guard" data-button="guard" data-kind="shield" aria-label="格挡">
        <svg class="icon-shield" viewBox="0 0 24 24" aria-hidden="true"><path class="shield-face" d="M12 2.5 4.5 5.2v6.1c0 4.6 3.1 8.6 7.5 10.2 4.4-1.6 7.5-5.6 7.5-10.2V5.2z"/><path class="shield-band" d="M11 3h2v18h-2zM5 10h14v2H5z"/></svg>
        <svg class="icon-blade" viewBox="0 0 24 24" aria-hidden="true"><path class="blade-steel" d="M8 10.6h11.5l3 1.4-3 1.4H8z"/><path class="blade-guard" d="M6 6.5h2.2v11H6z"/><path class="blade-grip" d="M1.5 10.9H6v2.2H1.5z"/></svg>
    </button>
    <button type="button" class="ctl ctl-interact idle" data-button="interact" aria-label="交互"><span data-hud="interact">交互</span></button>
    <button type="button" class="hud-menu" data-menu aria-label="菜单"><i></i><i></i></button>

    <div class="title" data-title hidden>
        <div class="title-cut" data-title-cut aria-hidden="true"></div>
        <div class="title-main">
            <h1 class="title-name">方块骑士</h1>
            <div class="title-keys">
                <button type="button" class="primary" data-title-act="continue">继续冒险</button>
                <button type="button" data-title-act="new">新的冒险</button>
                <button type="button" data-title-act="duel">联机对战</button>
                <button type="button" data-title-act="settings" aria-expanded="false" aria-controls="title-settings">设置</button>
            </div>
        </div>
        <section class="title-settings settings-page" id="title-settings" data-title-settings aria-label="设置" hidden></section>
    </div>

    <div class="panel" data-panel hidden>
        <div class="panel-card" role="dialog" aria-modal="true" aria-labelledby="panel-title">
            <h2 class="panel-title" id="panel-title" data-panel-title>暂停</h2>
            <p class="panel-note" data-panel-note></p>
            <dl class="panel-stats" data-panel-stats></dl>
            <div class="panel-actions">
                <button type="button" data-action="resume">继续</button>
                <button type="button" data-action="home">回到曙光村</button>
                <button type="button" data-action="rematch">再来一局</button>
                <button type="button" data-action="menu">菜单</button>
                <button type="button" data-action="surrender">认输</button>
                <button type="button" data-action="leave">离开对战</button>
                <button type="button" data-action="erase">清除并重新开始</button>
            </div>
        </div>
    </div>

    <div class="menu" data-menu-screen hidden>
        <div class="menu-card" role="dialog" aria-modal="true" aria-label="菜单">
            <section class="menu-figure" data-menu-figure aria-label="人物，拖动旋转">
                <p class="menu-figure-note">拖动旋转</p>
            </section>
            <section class="menu-gear menu-page" id="menu-page-role" data-menu-page-body="role" role="tabpanel" aria-label="角色">
                <div class="menu-life"><b>生命</b><div class="bar bar-hp"><i data-menu-hp></i></div><span data-menu-hp-text></span></div>
                <dl class="menu-stats" data-menu-stats></dl>
                <div class="menu-pack">
                    <div class="menu-slots" data-menu-slots></div>
                    <div class="menu-bag" data-menu-bag></div>
                </div>
                <div class="menu-detail" data-menu-detail></div>
            </section>
            <section class="settings-page menu-page" id="menu-page-settings" data-menu-page-body="settings" data-menu-settings role="tabpanel" aria-label="设置" hidden></section>
            <section class="menu-side">
                <div class="menu-tabs" role="tablist" aria-label="菜单页">
                    <button type="button" role="tab" data-menu-page="role" aria-controls="menu-page-role" aria-selected="true">角色</button>
                    <button type="button" role="tab" data-menu-page="settings" aria-controls="menu-page-settings" aria-selected="false">设置</button>
                </div>
                <button type="button" data-menu-act="pause">暂停</button>
                <button type="button" class="menu-title" data-menu-act="title">回到主界面</button>
            </section>
            <button type="button" class="menu-close" data-menu-act="close" aria-label="关闭">✕</button>
        </div>
    </div>

    <div class="panel room" data-room hidden>
        <div class="panel-card room-card" role="dialog" aria-modal="true" aria-labelledby="room-title">
            <div class="room-main">
                <h2 class="panel-title" id="room-title" data-room-title>联机对战</h2>
                <p class="panel-note" data-room-note></p>
                <div class="room-weapons" data-room-weapons role="radiogroup" aria-label="选武器" hidden></div>
                <div class="room-code" data-room-code aria-label="房间号" hidden><i></i><i></i><i></i><i></i></div>
                <p class="room-status" data-room-status role="status"></p>
                <div class="panel-actions">
                    <button type="button" data-room-action="host">创建房间</button>
                    <button type="button" data-room-action="join">加入房间</button>
                    <button type="button" data-room-action="connect">加入</button>
                    <button type="button" data-room-action="back">返回</button>
                </div>
            </div>
            <div class="room-keys" data-room-keys hidden>
                <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
                <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
                <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
                <button type="button" data-key="clear" aria-label="清空">清空</button><button type="button" data-key="0">0</button><button type="button" data-key="back" aria-label="删除">⌫</button>
            </div>
        </div>
    </div>

    <div class="screen" data-screen hidden>
        <div class="screen-card" role="dialog" aria-modal="true" aria-labelledby="screen-title">
            <header class="screen-head">
                <h2 class="screen-title" id="screen-title" data-screen-title>背包</h2>
                <nav class="screen-tabs" data-screen-tabs></nav>
                <span class="screen-gold" data-screen-gold></span>
                <button type="button" class="screen-close" data-screen-close>关闭</button>
            </header>
            <div class="screen-body">
                <ul class="screen-list" data-screen-list></ul>
                <section class="screen-detail" data-screen-detail></section>
            </div>
        </div>
    </div>

    <div class="rotate-hint" role="alert">
        <div class="rotate-phone" aria-hidden="true"></div>
        <p class="rotate-title">请把手机横过来</p>
        <p class="rotate-note">游戏只支持横屏</p>
    </div>
</main>
