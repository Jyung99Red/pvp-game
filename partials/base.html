<!-- The base no longer has a panel page of its own: it IS the safe region, drawn
     by the region view, where every facility is a building you walk up to. This
     partial is now just the dialogs those buildings open, plus the toast. -->
<div id="character-overlay" class="camp-overlay camp" aria-hidden="true">
    <section id="character-box" class="camp-dialog" role="dialog" aria-modal="true" aria-labelledby="character-title" tabindex="-1">
        <header class="camp-dialog-head"><div><span class="eyebrow">冒险者</span><h2 id="character-title">角色状态 <span id="char-level" class="level-chip"></span></h2></div><button class="dialog-close" onclick="ui.closeCharacterModal()" aria-label="关闭角色状态">×</button></header>
        <div class="dialog-wallet">可用金币 <strong id="char-gold">0</strong></div>
        <div class="camp-dialog-body">
            <div class="vital-line"><span>生命值</span><strong id="char-hp-text">—</strong></div>
            <div class="bar-wrap" id="char-hp-wrap"><div id="char-hp-fill" class="bar-inner hp-bar"></div></div>
            <div id="char-stats" class="camp-stats"></div>
            <div class="level-row"><div class="exp-info"><span id="char-exp-text"></span><div class="exp-track"><i id="char-exp-fill"></i></div></div><button onclick="player.levelUp()" id="btn-lvl-up" class="camp-action">角色升级 ↑</button></div>
            <div class="camp-section-head equip-head"><h2>当前装备</h2><button onclick="ui.openInventoryModal()" class="text-action">打开背包 ↗</button></div>
            <div id="equip-slots" class="camp-equipment"></div>
        </div>
        <details class="camp-tools"><summary>开发工具</summary><div class="btn-row"><button onclick="devCheat()" id="dev-cheat-btn" class="btn-dev">等级 +1 / 金币 +50</button><button onclick="save.resetToInitial()" id="dev-reset-btn" class="btn-dev">重置存档</button></div></details>
    </section>
</div>
<div id="building-overlay" class="camp-overlay" aria-hidden="true">
    <section class="camp-dialog" role="dialog" aria-modal="true" aria-labelledby="building-title" tabindex="-1">
        <header class="camp-dialog-head"><div><span class="eyebrow">设施管理</span><h2 id="building-title">基地建设</h2></div><button class="dialog-close" onclick="ui.closeBuildingModal()" aria-label="关闭基地建设">×</button></header>
        <div class="dialog-wallet">可用金币 <strong data-camp-gold>0</strong></div>
        <div class="camp-dialog-body" id="building-list"></div>
        <footer class="dialog-footnote">建设与升级立即生效。</footer>
    </section>
</div>

        <div id="inventory-overlay" class="camp-overlay" aria-hidden="true">
            <section id="inventory-box" class="camp-dialog" role="dialog" aria-modal="true" aria-labelledby="inventory-title" tabindex="-1">
                <header class="camp-dialog-head"><div><span class="eyebrow">物品管理</span><h2 id="inventory-title">背包 <span id="inv-count"></span></h2></div><button class="dialog-close" onclick="ui.closeInventoryModal()" aria-label="关闭背包">×</button></header>
                <div class="inventory-toolbar"><div class="inventory-filters" role="group" aria-label="物品分类">
                    <button data-inv-filter="all" onclick="ui.filterInventory('all')" aria-pressed="true">全部</button><button data-inv-filter="equipment" onclick="ui.filterInventory('equipment')" aria-pressed="false">装备</button><button data-inv-filter="material" onclick="ui.filterInventory('material')" aria-pressed="false">材料</button>
                </div><input id="inventory-search" type="search" placeholder="搜索物品名称" aria-label="搜索物品名称" oninput="ui.searchInventory(this.value)"></div>
                <div class="camp-dialog-body"><div class="inv-grid" id="inventory-grid"></div></div>
                <footer class="dialog-footnote">已装备物品置顶 · 点击物品查看详情</footer>
            </section>
        </div>
        <div id="modal-overlay" class="camp-overlay" aria-hidden="true">
            <section id="modal-box" class="camp-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
                <header class="camp-dialog-head"><div><span class="eyebrow">物品详情</span><h2 id="modal-title"></h2></div><button class="dialog-close" onclick="ui.closeModal()" aria-label="关闭物品详情">×</button></header>
                <div class="camp-dialog-body"><div class="modal-stat" id="modal-stats"></div><div id="modal-effects"></div><div class="modal-desc" id="modal-desc"></div></div>
                <footer class="modal-btns" id="modal-btns"></footer>
            </section>
        </div>
        <div id="smithy-overlay" class="camp-overlay" aria-hidden="true">
            <section id="smithy-box" class="camp-dialog" role="dialog" aria-modal="true" aria-labelledby="smithy-title" tabindex="-1">
                <header class="camp-dialog-head"><div><span class="eyebrow">装备制造</span><h2 id="smithy-title">铁匠铺</h2></div><button class="dialog-close" onclick="ui.closeSmithyModal()" aria-label="关闭铁匠铺">×</button></header>
                <p class="dialog-intro">选择装备，查看属性与所需材料。</p><div class="camp-dialog-body" id="smithy-recipe-list"></div>
                <footer class="dialog-footnote">绿色标记表示材料齐全。</footer>
            </section>
        </div>
        <div id="shop-overlay" class="camp-overlay" aria-hidden="true">
            <section id="shop-box" class="camp-dialog" role="dialog" aria-modal="true" aria-labelledby="shop-title" tabindex="-1">
                <header class="camp-dialog-head"><div><span class="eyebrow">物资补给</span><h2 id="shop-title">商店</h2></div><button class="dialog-close" onclick="ui.closeShopModal()" aria-label="关闭商店">×</button></header>
                <div class="dialog-wallet">可用金币 <strong data-camp-gold>0</strong></div><div class="camp-dialog-body" id="shop-list"></div>
                <footer class="dialog-footnote">购买的材料可在铁匠铺制作装备。</footer>
            </section>
        </div>

        <div id="camp-toast" class="camp-toast" role="status" aria-live="polite"></div>
