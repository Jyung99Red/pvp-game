<div id="view-battle" class="view-section hidden training spatial-fullscreen">
    <section class="arena" aria-label="俯视战场">
        <canvas id="pve-s-arena" aria-label="蓝色剑盾角色对战地下城敌人，橙色范围是起手，红色范围是锁定攻击"></canvas>
    <header class="topbar">
        <button type="button" onclick="pveLogic.flee()">撤退</button>
        <div><strong id="pve-floor-label">地下城</strong><span id="pve-enemy-name">敌人</span></div>
        <button id="pve-s-pause" type="button" onclick="pveLogic.pause()">暂停 / 设置</button>
    </header>
    <section class="vitals" aria-label="双方状态">
        <div class="vital"><div><span>你 · 剑盾</span><b id="pve-s-player-hp">120 / 120</b></div><meter id="pve-s-player-meter" min="0" max="120" value="120">120</meter></div>
        <div class="vital enemy"><div><span id="pve-enemy-vital">敌人</span><b id="pve-s-enemy-hp">360 / 360</b></div><meter id="pve-s-enemy-meter" min="0" max="360" value="360">360</meter></div>
    </section>

        <div class="legend"><i></i>起手 <i></i>锁定 <i></i>反击空档</div>
        <div id="pve-s-overlay" class="overlay" hidden>
            <div class="overlay-card"><h1>已暂停</h1><p>触摸已释放，点击继续战斗。</p>
            <fieldset class="combat-settings"><legend>玩家操作</legend>
                <label><input type="checkbox" data-combat-setting="cancelAtCenter" checked> 中心松手取消（重击 / 技能）</label>
                <small>关闭后重击直接释放；技能沿用本次最后选中方向，未拖出死区不释放。</small>
                <label><input type="checkbox" data-combat-setting="autoFace"> 自动朝向怪物</label>
                <small>仅待机时按转速自动转向敌人；移动跟随拖动方向，攻击按松手时人物朝向。</small>
            </fieldset>
            <button type="button" onclick="pveLogic.resume()">继续战斗</button></div>
        </div>
    <section class="feedback" aria-label="操作反馈">
        <div class="ap-row"><span>行动力</span><div id="pve-s-ap" aria-label="行动力 5 / 5"></div><span id="pve-s-player-state">准备就绪</span></div>
        <div class="charge-track"><div id="pve-s-charge-fill"></div></div>
        <div id="pve-s-notice" role="status">拖动移动 · 短按轻击 · 原位长按蓄力</div>
        <div class="skill-status">技能 <span id="pve-self-sp">0 / 3</span></div>
        <div id="pve-s-battle-log" class="battle-log" aria-label="最近战斗记录"></div>
        <div class="arena-top"><span id="pve-s-enemy-state">观察起手 → 走位或接招</span><span id="pve-s-clock">0:00</span></div>
        <div id="pve-log" aria-label="场地记录"></div>
    </section>
    <section class="controls combined-controls" aria-label="中央移动轻重击，左侧防御，右侧技能">
        <div class="control-group move-group" aria-label="中央操作区：拖动移动，短按轻击，原位长按蓄力">
            <button id="pve-s-move-pad" class="pad move-pad" data-origin-at-press type="button" aria-label="拖动移动；短按轻击；原位长按蓄力后拖动移动转向，圈外松手重击，回落指点松手取消">
                <span class="pad-icon">✥</span><strong id="pve-s-move-label">移动 / 攻击</strong><span class="cancel-zone" aria-hidden="true"></span><span class="pad-knob"></span>
            </button>
        </div>
        <div class="control-group guard-group">
            <button id="pve-s-guard-pad" class="pad guard-pad" type="button" aria-label="防御：按住举盾，拖动转向，可同时操作中央移动键，松手撤防">
                <span class="pad-icon">○</span><strong id="pve-s-guard-label">防御 / 转向</strong><span class="pad-knob"></span>
            </button>
        </div>
    <section class="skill-dock" aria-label="四向技能">

        <button id="pve-s-skill-pad" class="pad skill-pad" type="button" aria-label="拖动选择技能，松手释放：上治疗、右疾速、下满蓄、左弹反">
            <strong id="pve-s-skill-label">技能</strong><span class="pad-knob"></span>
            <span data-skill="heal" class="skill-direction skill-up">治疗 · 2</span>
            <span data-skill="haste" class="skill-direction skill-right">疾速 · 2</span>
            <span data-skill="full" class="skill-direction skill-down">满蓄 · 2</span>
            <span data-skill="parry" class="skill-direction skill-left">弹反 · 3</span>
        </button>
    </section>
    </section>

    <div id="pve-buff-display" class="buff-status"></div>
    <div id="log"></div>
    </section>
    <div id="pve-empty-overlay" class="result-overlay hidden">
        <h2>准备探索地下城</h2><p>中央拖动移动、短按轻击；原位长按蓄力后拖动，圈外松手重击，回落指点取消。</p>
        <button onclick="pveLogic.enterDungeon()">下地下城</button><button onclick="ui.switchTab('base')">回到基地</button>
    </div>
    <div id="pve-win-overlay" class="result-overlay hidden">
        <h2>战斗胜利</h2><div id="pve-win-loot"></div>
        <div class="btn-row"><button onclick="pveLogic.continueNext()">继续深入</button><button onclick="pveLogic.safeRetreat()">携宝回城</button></div>
    </div>
    <div id="pve-defeat-overlay" class="result-overlay hidden">
        <h2>英雄倒下</h2><p>本次携带金币已失去。</p><button onclick="pveLogic.endFight(false)">回到基地</button>
    </div>
</div>
